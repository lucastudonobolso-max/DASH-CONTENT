<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TudoNoBolso — Tracker 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde: #1A7A4A; --verde-claro: #E8F5EE;
  --azul: #1E4D8C; --azul-claro: #EBF3FF;
  --roxo: #6B3FA0; --roxo-claro: #EDE8F7;
  --laranja: #E07B2A;
  --bg: #F7F7F5; --card: #FFFFFF;
  --border: #E4E4E0; --text: #1A1A18; --muted: #888780;
  --success: #1A7A4A; --success-bg: #E8F5EE;
  --warn: #B45309; --warn-bg: #FEF3C7;
  --info: #1E4D8C; --info-bg: #EBF3FF;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.header { background: var(--verde); padding: 28px 40px 0; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 20px; }
.header-left { display: flex; flex-direction: column; gap: 4px; }
.header-logo { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); letter-spacing: 0.08em; text-transform: uppercase; }
.header-title { font-size: 26px; font-weight: 600; color: #fff; line-height: 1.2; }
.header-sub { font-size: 14px; color: rgba(255,255,255,0.65); margin-top: 2px; }
.header-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 99px; white-space: nowrap; margin-top: 4px; }

/* TABS */
.tabs { display: flex; gap: 4px; padding-top: 4px; overflow-x: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 18px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6); cursor: pointer; border-radius: 8px 8px 0 0; border: none; background: transparent; font-family: inherit; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
.tab:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); }
.tab.active { color: var(--text); background: var(--bg); font-weight: 600; }
.tab-geral { font-size: 13px; }

/* MAIN */
.main { max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* SECTION LABEL */
.section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; }
.section-label:first-child { margin-top: 0; }

/* KPI ROW */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.kpi-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.kpi-val { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* FORMATS GRID */
.formats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fmt-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.fmt-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.fmt-name { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
.fmt-icon { font-size: 18px; }
.pct-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.pill-ok { background: var(--success-bg); color: var(--success); }
.pill-over { background: var(--info-bg); color: var(--info); }
.pill-zero { background: var(--border); color: var(--muted); }
.pill-partial { background: var(--warn-bg); color: var(--warn); }
.bar-bg { background: #F0F0EE; border-radius: 99px; height: 5px; overflow: hidden; margin-bottom: 10px; }
.bar-fill { height: 5px; border-radius: 99px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
.fmt-counts { display: flex; justify-content: space-between; align-items: baseline; }
.fmt-real { font-size: 20px; font-weight: 600; color: var(--text); }
.fmt-meta { font-size: 12px; color: var(--muted); }

/* PILARES */
.pilares-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pilar-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.pilar-top { display: flex; align-items: center; gap: 8px; }
.pilar-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pilar-nome { font-size: 13px; font-weight: 600; color: var(--text); }
.pilar-nums { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
.pilar-real { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
.pilar-meta { font-size: 13px; color: var(--muted); }
.pilar-bar-bg { background: #F0F0EE; border-radius: 99px; height: 4px; overflow: hidden; margin-top: 6px; }
.pilar-bar-fill { height: 4px; border-radius: 99px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
.pilar-of { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* PUBLICAÇÕES */
.add-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.add-row { display: grid; grid-template-columns: 1fr 130px 160px 160px auto; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.field input, .field select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); width: 100%; transition: border-color 0.15s; }
.field input:focus, .field select:focus { outline: none; border-color: var(--verde); }
.btn-add { background: var(--verde); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; height: 40px; transition: background 0.15s; }
.btn-add:hover { background: #155f39; }
.pub-list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pub-list-header { display: grid; grid-template-columns: 1fr 100px 130px 130px 36px; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
.pub-list-header span { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pub-item { display: grid; grid-template-columns: 1fr 100px 130px 130px 36px; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.pub-item:last-child { border-bottom: none; }
.pub-titulo { font-size: 14px; font-weight: 500; color: var(--text); }
.pub-data { font-size: 13px; color: var(--muted); }
.pub-formato { font-size: 12px; font-weight: 500; }
.pilar-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.tag-vendas { background: var(--success-bg); color: var(--success); }
.tag-branding { background: var(--info-bg); color: var(--info); }
.tag-saude { background: #EDE8F7; color: var(--roxo); }
.btn-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; transition: color 0.15s; display: flex; align-items: center; justify-content: center; }
.btn-del:hover { color: #c0392b; }
.pub-empty { padding: 32px; text-align: center; font-size: 14px; color: var(--muted); }

/* CONFIG */
.config-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.config-card h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.config-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.config-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.config-field { display: flex; flex-direction: column; gap: 5px; }
.config-field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.config-field input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); width: 100%; transition: border-color 0.15s; }
.config-field input:focus { outline: none; border-color: var(--verde); }
.btn-save-config { background: var(--verde); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background 0.15s; }
.btn-save-config:hover { background: #155f39; }

/* GERAL — gráfico de barras */
.chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 20px 16px; }
.chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-bottom: 4px; }
.chart-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
.chart-bar-wrap { display: flex; align-items: flex-end; height: 140px; width: 100%; justify-content: center; }
.chart-bar { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; transition: height 0.6s cubic-bezier(.4,0,.2,1); position: relative; }
.chart-bar-val { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }
.chart-label { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; }

/* GERAL — tabela evolução */
.evo-table { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.evo-row { display: grid; gap: 0; border-bottom: 1px solid var(--border); }
.evo-row:last-child { border-bottom: none; }
.evo-header { background: var(--bg); }
.evo-cell { padding: 10px 14px; font-size: 13px; text-align: center; border-right: 1px solid var(--border); }
.evo-cell:first-child { text-align: left; font-weight: 500; }
.evo-cell:last-child { border-right: none; }
.evo-header .evo-cell { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.evo-total { background: var(--verde-claro); font-weight: 600; }

/* BACKLOG */
.bk-add-row { display: grid; grid-template-columns: 1fr 140px 160px 220px auto; gap: 10px; align-items: end; margin-bottom: 16px; }
.bk-list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.bk-header { display: grid; grid-template-columns: 1fr 120px 140px 180px 36px; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
.bk-header span { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.bk-item { display: grid; grid-template-columns: 1fr 120px 140px 180px 36px; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.bk-item:last-child { border-bottom: none; }
.bk-titulo { font-size: 14px; font-weight: 500; color: var(--text); }
.bk-link { font-size: 12px; color: var(--azul); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.bk-link:hover { text-decoration: underline; }
.bk-empty { padding: 32px; text-align: center; font-size: 14px; color: var(--muted); }
.status-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.st-ideia { background: #FEF3C7; color: #B45309; }
.st-producao { background: #EBF3FF; color: #1E4D8C; }
.st-aprovado { background: #E8F5EE; color: #1A7A4A; }
.st-descartado { background: #F0F0EE; color: #888780; }


.analytics-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 0; }
.akpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.akpi-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.akpi-val { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
.akpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.akpi-delta { font-size: 12px; font-weight: 600; margin-top: 6px; }
.delta-up { color: var(--success); }
.delta-down { color: #c0392b; }
.delta-eq { color: var(--muted); }
.an-input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.an-field { display: flex; flex-direction: column; gap: 5px; }
.an-field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.an-field input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); width: 100%; }
.an-field input:focus { outline: none; border-color: var(--verde); }
.an-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.an-section h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.an-section p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.cfo-card { background: linear-gradient(135deg, #1A7A4A 0%, #1E4D8C 100%); border-radius: 12px; padding: 24px; margin-bottom: 16px; color: #fff; }
.cfo-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; margin-bottom: 16px; }
.cfo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cfo-item { display: flex; flex-direction: column; gap: 4px; }
.cfo-num { font-size: 24px; font-weight: 600; line-height: 1; }
.cfo-desc { font-size: 12px; opacity: 0.75; }
.evo-analytics { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }


.cal-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow { padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; background: var(--bg); border-bottom: 1px solid var(--border); }
.cal-day { min-height: 88px; padding: 8px 6px 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: top; position: relative; }
.cal-day:nth-child(7n) { border-right: none; }
.cal-day.vazio { background: var(--bg); opacity: 0.4; }
.cal-day.hoje { background: #FFFBF0; }
.cal-num { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: block; }
.cal-day.hoje .cal-num { color: var(--laranja); }
.cal-pub { font-size: 10px; font-weight: 500; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 100%; transition: opacity 0.15s; }
.cal-pub:hover { opacity: 0.75; }
.cal-pub.pil-vendas { background: var(--success-bg); color: var(--success); }
.cal-pub.pil-branding { background: var(--info-bg); color: var(--info); }
.cal-pub.pil-saude { background: #EDE8F7; color: var(--roxo); }
.cal-pub.pil-extra { background: var(--border); color: var(--muted); }
.cal-mais { font-size: 10px; color: var(--muted); padding: 1px 4px; }
/* Tooltip */
.cal-tooltip { position: fixed; background: var(--text); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px; z-index: 999; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 220px; line-height: 1.5; }
.cal-tooltip.visible { opacity: 1; }
.cal-legenda { display: flex; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.cal-leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.cal-leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }


.save-status { font-size: 12px; color: var(--success); margin-left: 12px; opacity: 0; transition: opacity 0.3s; display: inline-block; }
.save-status.visible { opacity: 1; }
.footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }

@media (max-width: 700px) {
  .header { padding: 20px 20px 0; }
  .header-top { flex-direction: column; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .formats-grid { grid-template-columns: repeat(2, 1fr); }
  .pilares-row { grid-template-columns: 1fr; }
  .add-row { grid-template-columns: 1fr 1fr; }
  .add-row .btn-add { grid-column: span 2; }
  .pub-list-header { display: none; }
  .pub-item { grid-template-columns: 1fr auto; }
  .config-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="header-logo">TudoNoBolso</div>
      <div class="header-title">Tracker de Conteúdo 2026</div>
      <div class="header-sub">Social Media 2.0 · Jul – Dez</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span id="sync-status" style="font-size:12px;color:rgba(255,255,255,0.7);opacity:0;transition:opacity 0.5s;"></span>
      <button id="btn-sync-tudo" onclick="sincronizarTudo()"
        style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:500;padding:6px 14px;border-radius:99px;cursor:pointer;font-family:inherit;white-space:nowrap;">
        ☁️ Sincronizar tudo
      </button>
      <button id="btn-restaurar" onclick="restaurarDoSheets()"
        style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:500;padding:6px 14px;border-radius:99px;cursor:pointer;font-family:inherit;white-space:nowrap;">
        ☁️ Restaurar do Sheets
      </button>
      <div class="header-badge" id="header-badge">0 publicações no ano</div>
    </div>
  </div>
  <div class="tabs" id="tabs-root"></div>
</div>

<div class="main" id="main-root"></div>

<script>
// ═══════════════════════════════════════════════════
// CONFIGURAÇÃO GLOBAL
// ═══════════════════════════════════════════════════
const MESES = ['Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_TEMAS = {
  'Julho':    'Arraiá · Férias · Copa · Planejamento 2º sem.',
  'Agosto':   'Volta às aulas · Dia dos Pais · Clube Niky',
  'Setembro': 'Setembro Amarelo · Dia do Cliente · Educação Financeira',
  'Outubro':  'Dia das Crianças · Black Friday Esquenta · Eleições',
  'Novembro': 'Black Friday · Clube Niky · 13º',
  'Dezembro': 'Natal · Férias · Virar o ano no verde'
};

const FORMATOS_CFG = {
  Feed:         { meta: 8,  icon: '📱', cor: '#1A7A4A' },
  Reels:        { meta: 4,  icon: '🎬', cor: '#E07B2A' },
  Stories:      { meta: 12, icon: '⭕', cor: '#6B3FA0' },
  Blog:         { meta: 2,  icon: '📝', cor: '#1E4D8C' },
  LinkedIn:     { meta: 2,  icon: '💼', cor: '#0077B5' },
  YouTube:      { meta: 2,  icon: '▶️', cor: '#FF0000' },
  Dino:         { meta: 1,  icon: '📰', cor: '#1A7A4A' },
  ADS:          { meta: 3,  icon: '🎯', cor: '#E07B2A' },
  'Meme/Extra': { meta: 4,  icon: '😂', cor: '#888780' }
};

const PILARES_CFG = [
  { nome: 'Vendas',           cor: '#1A7A4A', meta: 3  },
  { nome: 'Branding',         cor: '#1E4D8C', meta: 11 },
  { nome: 'Saúde Financeira', cor: '#6B3FA0', meta: 7  }
];

// Storage keys por mês
const SK = m => `tnb_2026_${m.toLowerCase()}`;
const SK_CFG = m => `tnb_cfg_2026_${m.toLowerCase()}`;
const SK_DEST = m => `tnb_dest_2026_${m.toLowerCase()}`;

// ── URL do Apps Script — cole aqui após implantar ──
let SHEETS_URL = localStorage.getItem('tnb_sheets_url') || '';


// ── Estado global ──
let estado = {};  // { mes: { pubs:[], metasFormatos:{}, metasPilares:[], destaques:[] } }

function initEstado() {
  MESES.forEach(mes => {
    // Publicações
    let pubs = [];
    try { const s = localStorage.getItem(SK(mes)); if(s) pubs = JSON.parse(s); } catch(e){}

    // Metas formatos
    let mf = {};
    Object.entries(FORMATOS_CFG).forEach(([k,v]) => mf[k] = v.meta);
    try { const s = localStorage.getItem(SK_CFG(mes)+'_fmt'); if(s) mf = {...mf, ...JSON.parse(s)}; } catch(e){}

    // Metas pilares
    let mp = PILARES_CFG.map(p => ({...p}));
    try { const s = localStorage.getItem(SK_CFG(mes)+'_pil'); if(s) mp = JSON.parse(s); } catch(e){}

    // Destaques
    let dest = [
      { icon:'⭐', texto:'(Preencha os destaques do mês)', sub:'' }
    ];
    try { const s = localStorage.getItem(SK_DEST(mes)); if(s) dest = JSON.parse(s); } catch(e){}

    // Tema
    let tema = MESES_TEMAS[mes] || '';
    try { const s = localStorage.getItem(SK_CFG(mes)+'_tema'); if(s) tema = s; } catch(e){}

    // Analytics
    let analytics = { alcance:0, impressoes:0, engajamento:0, seguidores:0, seguidoresAntes:0, cliques:0, leads:0, investimentoAds:0, custoLead:0 };
    try { const s = localStorage.getItem(SK_CFG(mes)+'_analytics'); if(s) analytics = {...analytics, ...JSON.parse(s)}; } catch(e){}

    // Backlog
    let backlog = [];
    try { const s = localStorage.getItem(SK_CFG(mes)+'_backlog'); if(s) backlog = JSON.parse(s); } catch(e){}

    // Temas (conteúdos agendados com múltiplos formatos)
    let temas = [];
    try { const s = localStorage.getItem(SK_CFG(mes)+'_temas'); if(s) temas = JSON.parse(s); } catch(e){}

    estado[mes] = { pubs, metasFormatos: mf, metasPilares: mp, destaques: dest, tema, analytics, backlog, temas };
  });
}

function salvarMes(mes) {
  const e = estado[mes];
  try {
    localStorage.setItem(SK(mes), JSON.stringify(e.pubs));
    localStorage.setItem(SK_CFG(mes)+'_fmt', JSON.stringify(e.metasFormatos));
    localStorage.setItem(SK_CFG(mes)+'_pil', JSON.stringify(e.metasPilares));
    localStorage.setItem(SK_DEST(mes), JSON.stringify(e.destaques));
    localStorage.setItem(SK_CFG(mes)+'_tema', e.tema || '');
    localStorage.setItem(SK_CFG(mes)+'_analytics', JSON.stringify(e.analytics));
    localStorage.setItem(SK_CFG(mes)+'_backlog', JSON.stringify(e.backlog));
    localStorage.setItem(SK_CFG(mes)+'_temas', JSON.stringify(e.temas || []));
  } catch(err){}
  // Envia pro Sheets em background
  enviarSheets(mes);
}

function enviarSheets(mes) {
  if (!SHEETS_URL) return;
  // Usa iframe + form pra contornar CORS em arquivo local
  const dados = JSON.stringify({ mes, dados: estado[mes] });
  enviarViaForm(dados);
}

function enviarViaForm(dadosJSON) {
  if (!SHEETS_URL) return;
  // Cria iframe invisível pra receber resposta sem redirecionar
  let iframe = document.getElementById('_sheets_iframe');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.id = '_sheets_iframe';
    iframe.name = '_sheets_iframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }
  // Cria form e submete
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = SHEETS_URL;
  form.target = '_sheets_iframe';
  form.style.display = 'none';
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'payload';
  input.value = dadosJSON;
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  setTimeout(() => { document.body.removeChild(form); mostrarSyncOK(); }, 1500);
}

async function sincronizarTudo() {
  if (!SHEETS_URL) {
    alert('Configure a URL do Sheets primeiro na aba Geral.');
    return;
  }
  const btn = document.getElementById('btn-sync-tudo');
  if (btn) { btn.textContent = 'Enviando...'; btn.disabled = true; }

  // Envia um mês por vez com delay pra não sobrecarregar
  for (let i = 0; i < MESES.length; i++) {
    const mes = MESES[i];
    const dados = JSON.stringify({ mes, dados: estado[mes] });
    enviarViaForm(dados);
    await new Promise(r => setTimeout(r, 800));
  }

  if (btn) { btn.textContent = '✓ Tudo enviado!'; }
  setTimeout(() => {
    if (btn) { btn.textContent = '☁️ Sincronizar tudo'; btn.disabled = false; }
  }, 3000);
}

function mostrarSyncOK() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = '☁️ Salvo no Sheets';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 3000);
}

async function restaurarDoSheets() {
  if (!SHEETS_URL) {
    alert('Configure a URL do Sheets primeiro nas Configurações.');
    return;
  }
  const btn = document.getElementById('btn-restaurar');
  if (btn) { btn.textContent = 'Restaurando...'; btn.disabled = true; }
  try {
    const r = await fetch(SHEETS_URL);
    const json = await r.json();
    if (!json.ok || !json.dados) throw new Error('Sem dados');
    let total = 0;
    MESES.forEach(mes => {
      if (json.dados[mes]) {
        const d = json.dados[mes];
        estado[mes] = {
          pubs:           d.pubs           || [],
          metasFormatos:  d.metasFormatos  || {},
          metasPilares:   d.metasPilares   || [],
          destaques:      d.destaques      || [],
          tema:           d.tema           || '',
          analytics:      d.analytics      || {},
          backlog:        d.backlog        || []
        };
        // Re-salva no localStorage
        localStorage.setItem(SK(mes), JSON.stringify(estado[mes].pubs));
        localStorage.setItem(SK_CFG(mes)+'_fmt', JSON.stringify(estado[mes].metasFormatos));
        localStorage.setItem(SK_CFG(mes)+'_pil', JSON.stringify(estado[mes].metasPilares));
        localStorage.setItem(SK_DEST(mes), JSON.stringify(estado[mes].destaques));
        localStorage.setItem(SK_CFG(mes)+'_tema', estado[mes].tema);
        localStorage.setItem(SK_CFG(mes)+'_analytics', JSON.stringify(estado[mes].analytics));
        localStorage.setItem(SK_CFG(mes)+'_backlog', JSON.stringify(estado[mes].backlog));
        total += (d.pubs||[]).length;
      }
    });
    buildTabs();
    buildMain();
    alert(`✅ Restaurado com sucesso! ${total} publicações recuperadas do Sheets.`);
  } catch(err) {
    alert('Erro ao restaurar. Verifique a URL do Sheets nas Configurações.');
  } finally {
    if (btn) { btn.textContent = '☁️ Restaurar do Sheets'; btn.disabled = false; }
  }
}

function salvarSheetsURL() {
  const el = document.getElementById('inp-sheets-url');
  if (!el) return;
  SHEETS_URL = el.value.trim();
  localStorage.setItem('tnb_sheets_url', SHEETS_URL);
  flash('status-sheets-url');
}

function buildMain() {

  } else if (abaAtiva === 'analytics') {

    root.innerHTML = buildMesHTML(abaAtiva);
    renderMesDashboard(abaAtiva);
    renderMesLista(abaAtiva);

  atualizarBadge();
}

function renderGrafico() {
  const wrap = document.getElementById('chart-bars');
  if (!wrap) return;
  const totais = MESES.map(m => estado[m].pubs.length);
  const max = Math.max(...totais, 1);
  const cores = ['#1A7A4A','#1E4D8C','#6B3FA0','#E07B2A','#1A7A4A','#1E4D8C'];

  wrap.innerHTML = MESES.map((m, i) => {
    const v = totais[i];
    const h = Math.round((v / max) * 120);
    return `
      <div class="chart-col">
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height:${h}px;background:${cores[i]};">
            <span class="chart-bar-val">${v||''}</span>
          </div>
        </div>
        <div class="chart-label">${m.slice(0,3)}</div>
      </div>`;
  }).join('');
}

let subAbas = {};
function trocarSubAba(mes, sub, btn) {
  ['dashboard','publicacoes','calendario','analytics','backlog','temas','configuracoes'].forEach(s => {
    const el = document.getElementById(`subpanel-${mes}-${s}`);
    if(el) el.style.display = s===sub ? 'block' : 'none';
    const b = document.getElementById(`subtab-${mes}-${s}`);
    if(b) { b.style.color = s===sub ? 'var(--verde)' : 'var(--muted)';
            b.style.borderBottomColor = s===sub ? 'var(--verde)' : 'transparent';
            b.style.fontWeight = s===sub ? '600' : '500'; }
  });
  subAbas[mes] = sub;
  if(sub==='configuracoes') renderCfg(mes);
  if(sub==='calendario') renderCalendario(mes);
  if(sub==='backlog') renderBacklog(mes);
  if(sub==='temas') { renderTemas(mes); initFormatosTema(mes); }
}

// RENDER DASHBOARD DO MÊS
// ═══════════════════════════════════════════════════
function pct(r,m){ return m===0?0:Math.round(r/m*100); }
function pillClass(p,r){
  if(r===0) return 'pill-zero';
  if(p>=100) return 'pill-over';
  if(p>=60)  return 'pill-ok';
  return 'pill-partial';
}

function renderMesDashboard(mes) {
  const e = estado[mes];
  const pubs = e.pubs;
  const mf = e.metasFormatos;
  const mp = e.metasPilares;

  // KPIs
  const totalMeta = Object.values(mf).reduce((a,b)=>a+b,0);
  const totalReal = pubs.length;
  const p = pct(totalReal, totalMeta);
  const ativos = Object.keys(mf).filter(k => pubs.some(pub=>pub.formato===k)).length;
  const kpis = [
    { label:'Publicações planejadas', val: totalMeta, sub:'no mês' },
    { label:'Publicações realizadas', val: totalReal, sub:'registradas' },
    { label:'Taxa de execução', val: totalReal===0?'—':p+'%', sub:'do planejado' },
    { label:'Formatos ativos', val: ativos+' / '+Object.keys(mf).length, sub:'formatos cobertos' }
  ];
  document.getElementById(`kpi-${mes}`).innerHTML = kpis.map(k=>`
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');

  // Formatos
  document.getElementById(`fmt-${mes}`).innerHTML = Object.entries(mf).map(([fmt, meta])=>{
    const r = pubs.filter(p=>p.formato===fmt).length;
    const pp = pct(r, meta);
    return `
      <div class="fmt-card">
        <div class="fmt-top">
          <div class="fmt-name"><span class="fmt-icon">${FORMATOS_CFG[fmt]?.icon||'📌'}</span>${fmt}</div>
          <span class="pct-pill ${pillClass(pp,r)}">${r===0?'—':pp+'%'}</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(pp,100)}%;background:${FORMATOS_CFG[fmt]?.cor||'#888'};"></div></div>
        <div class="fmt-counts">
          <span class="fmt-real">${r}</span>
          <span class="fmt-meta">${meta>0?'meta: '+meta:'sem meta'}</span>
        </div>
      </div>`;
  }).join('');

  // Pilares
  document.getElementById(`pil-${mes}`).innerHTML = mp.map(pc=>{
    const r = pubs.filter(p=>p.pilar===pc.nome).length;
    const pp = pct(r, pc.meta);
    return `
      <div class="pilar-card">
        <div class="pilar-top">
          <span class="pilar-dot" style="background:${pc.cor};"></span>
          <span class="pilar-nome">${pc.nome}</span>
        </div>
        <div class="pilar-nums">
          <span class="pilar-real">${r}</span>
          <span class="pilar-meta">/ ${pc.meta} planejadas</span>
        </div>
        <div class="pilar-bar-bg">
          <div class="pilar-bar-fill" style="width:${Math.min(pp,100)}%;background:${pc.cor};"></div>
        </div>
        <div class="pilar-of">${pp}% do planejado</div>
      </div>`;
  }).join('');

  // Destaques
  document.getElementById(`dest-${mes}`).innerHTML = e.destaques.map(d=>`
    <div class="destaque-item">
      <span class="destaque-icon">${d.icon}</span>
      <div>
        <div class="destaque-texto">${d.texto}</div>
        ${d.sub?`<div class="destaque-sub">${d.sub}</div>`:''}
      </div>
    </div>`).join('');

  // Ativa subtab dashboard
  setTimeout(()=>trocarSubAba(mes,'dashboard',null),0);

  // Data padrão
  const inp = document.getElementById(`inp-data-${mes}`);
  if(inp) inp.valueAsDate = new Date();
}

function adicionarPub(mes) {
  const titulo  = document.getElementById(`inp-titulo-${mes}`).value.trim();
  const data    = document.getElementById(`inp-data-${mes}`).value;
  const formato = document.getElementById(`inp-fmt-${mes}`).value;
  const pilar   = document.getElementById(`inp-pil-${mes}`).value;
  if(!titulo||!formato||!pilar){ alert('Preencha título, formato e pilar.'); return; }
  estado[mes].pubs.push({ id: Date.now(), titulo, data, formato, pilar });
  salvarMes(mes);
  renderMesDashboard(mes);
  renderMesLista(mes);
  document.getElementById(`inp-titulo-${mes}`).value='';
  document.getElementById(`inp-fmt-${mes}`).value='';
  document.getElementById(`inp-pil-${mes}`).value='';
  document.getElementById(`inp-data-${mes}`).valueAsDate = new Date();
  trocarSubAba(mes,'publicacoes',null);
  flash(`status-add-${mes}`);
  atualizarBadge();
}

function deletarPub(mes, id) {
  estado[mes].pubs = estado[mes].pubs.filter(p=>p.id!==id);
  salvarMes(mes);
  renderMesDashboard(mes);
  renderMesLista(mes);
  trocarSubAba(mes,'publicacoes',null);
  atualizarBadge();
}

function renderMesLista(mes) {
  const pubs = estado[mes].pubs;
  const el = document.getElementById(`pub-list-${mes}`);
  const cnt = document.getElementById(`pub-count-${mes}`);
  if(!el) return;
  if(cnt) cnt.textContent = pubs.length>0?`(${pubs.length})`:'';
  if(pubs.length===0){ el.innerHTML=`<div class="pub-empty">Nenhuma publicação ainda. Adicione acima.</div>`; return; }
  const sorted = [...pubs].sort((a,b)=>{
    if(!a.data&&!b.data) return 0; if(!a.data) return 1; if(!b.data) return -1;
    return a.data.localeCompare(b.data);
  });
  const tagPilar = p => {
    if(p==='Vendas')           return `<span class="pilar-tag tag-vendas">Vendas</span>`;
    if(p==='Branding')         return `<span class="pilar-tag tag-branding">Branding</span>`;
    if(p==='Saúde Financeira') return `<span class="pilar-tag tag-saude">Saúde Fin.</span>`;
    return `<span class="pilar-tag">${p}</span>`;
  };
  const fmtData = d => { if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}`; };
  el.innerHTML = `
    <div class="pub-list-header">
      <span>Título</span><span>Data</span><span>Formato</span><span>Pilar</span><span></span>
    </div>` +
    sorted.map(p=>`
    <div class="pub-item">
      <span class="pub-titulo">${p.titulo}</span>
      <span class="pub-data">${fmtData(p.data)}</span>
      <span class="pub-formato">${FORMATOS_CFG[p.formato]?.icon||'📌'} ${p.formato}</span>
      ${tagPilar(p.pilar)}
      <button class="btn-del" onclick="deletarPub('${mes}',${p.id})">×</button>
    </div>`).join('');
}

// ABA ANALYTICS GLOBAL
// ═══════════════════════════════════════════════════
function fmt(n) {
  if(!n||n===0) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.',',')+'K';
  return n.toLocaleString('pt-BR');
}
function fmtR(n) { if(!n||n===0) return '—'; return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function deltaHTML(atual, anterior) {
  if(!anterior||anterior===0) return '';
  const d = Math.round(((atual-anterior)/anterior)*100);
  if(d>0) return `<div class="akpi-delta delta-up">▲ ${d}% vs mês ant.</div>`;
  if(d<0) return `<div class="akpi-delta delta-down">▼ ${Math.abs(d)}% vs mês ant.</div>`;
  return `<div class="akpi-delta delta-eq">= estável</div>`;
}

// ═══════════════════════════════════════════════════
// CALENDÁRIO
// ═══════════════════════════════════════════════════
const MESES_NUM = { 'Julho':7,'Agosto':8,'Setembro':9,'Outubro':10,'Novembro':11,'Dezembro':12 };
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function pilClass(pilar) {
  if(pilar==='Vendas')           return 'pil-vendas';
  if(pilar==='Branding')        return 'pil-branding';
  if(pilar==='Saúde Financeira') return 'pil-saude';
  return 'pil-extra';
}

function renderCalendario(mes) {
  const grid = document.getElementById(`cal-grid-${mes}`);
  if(!grid) return;

  const ano = 2026;
  const mesNum = MESES_NUM[mes];
  const diasNoMes = new Date(ano, mesNum, 0).getDate();
  const primeiroDia = new Date(ano, mesNum-1, 1).getDay(); // 0=Dom

  // Agrupa pubs por dia
  const pubsPorDia = {};
  estado[mes].pubs.forEach(p => {
    let dia = 1;
    if(p.data) {
      const d = new Date(p.data + 'T12:00:00');
      if(d.getMonth()+1 === mesNum) dia = d.getDate();
    }
    if(!pubsPorDia[dia]) pubsPorDia[dia] = [];
    pubsPorDia[dia].push({ ...p, _tipo: 'pub' });
  });

  // Agrupa temas por dia
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  (estado[mes].temas||[]).forEach(t => {
    t.formatos.forEach((f,fi) => {
      if(!f.data) return;
      const d = new Date(f.data+'T12:00:00');
      if(d.getMonth()+1 !== mesNum) return;
      const dia = d.getDate();
      if(!pubsPorDia[dia]) pubsPorDia[dia] = [];
      // Determina status visual
      let statusCor, statusLabel;
      if(f.status==='Publicado')     { statusCor='#1A7A4A'; statusLabel='✅'; }
      else if(f.status==='Cancelado'){ statusCor='#888780'; statusLabel='⚫'; }
      else if(d < hoje)              { statusCor='#c0392b'; statusLabel='🔴'; }
      else if(d.toDateString()===hoje.toDateString()) { statusCor='#B45309'; statusLabel='🟡'; }
      else                           { statusCor='#1E4D8C'; statusLabel='🔵'; }
      pubsPorDia[dia].push({
        titulo: `${t.titulo} — ${f.formato}`,
        formato: f.formato, pilar: t.pilar,
        _tipo: 'tema', _cor: statusCor, _label: statusLabel,
        _temaId: t.id, _fmtIdx: fi, _status: f.status
      });
    });
  });

  // Cabeçalho dias da semana
  let html = DIAS_SEMANA.map(d => `<div class="cal-dow">${d}</div>`).join('');

  // Células vazias antes do dia 1
  for(let i=0; i<primeiroDia; i++) html += `<div class="cal-day vazio"></div>`;

  // Dias do mês
  const hoje2 = new Date();
  for(let dia=1; dia<=diasNoMes; dia++) {
    const isHoje = hoje2.getDate()===dia && hoje2.getMonth()+1===mesNum && hoje2.getFullYear()===ano;
    const items = pubsPorDia[dia] || [];
    const maxShow = 3;
    const itemsHtml = items.slice(0, maxShow).map(item => {
      const icon = FORMATOS_CFG[item.formato]?.icon || '📌';
      const titulo = item.titulo.length > 18 ? item.titulo.slice(0,18)+'…' : item.titulo;
      if(item._tipo === 'tema') {
        // Item de tema — cor baseada no status
        const cor = item._cor || '#1E4D8C';
        const bg = cor+'22';
        return `<span style="font-size:10px;font-weight:500;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%;
          background:${bg};color:${cor};border:1px solid ${cor}40;"
          onmouseenter="showTooltip(event,'${item._label} ${item.titulo} · ${item._status}')"
          onmouseleave="hideTooltip()">${item._label} ${titulo}</span>`;
      }
      return `<span class="cal-pub ${pilClass(item.pilar)}"
        onmouseenter="showTooltip(event,'${item.titulo.replace(/'/g,"\\'")} · ${item.formato} · ${item.pilar}')"
        onmouseleave="hideTooltip()">${icon} ${titulo}</span>`;
    }).join('');
    const mais = items.length > maxShow ? `<span class="cal-mais">+${items.length-maxShow} mais</span>` : '';
    html += `<div class="cal-day${isHoje?' hoje':''}">
      <span class="cal-num">${dia}</span>
      ${itemsHtml}${mais}
    </div>`;
  }

  // Células vazias no final pra completar a última linha
  const total = primeiroDia + diasNoMes;
  const resto = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let i=0; i<resto; i++) html += `<div class="cal-day vazio"></div>`;

  grid.innerHTML = html;
}

// Tooltip
let tooltipEl = null;
function showTooltip(e, texto) {
  if(!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'cal-tooltip';
    document.body.appendChild(tooltipEl);
  }
  tooltipEl.textContent = texto;
  tooltipEl.classList.add('visible');
  moveTooltip(e);
  document.addEventListener('mousemove', moveTooltip);
}
function moveTooltip(e) {
  if(!tooltipEl) return;
  tooltipEl.style.left = (e.clientX + 12) + 'px';
  tooltipEl.style.top  = (e.clientY + 12) + 'px';
}
function hideTooltip() {
  if(tooltipEl) tooltipEl.classList.remove('visible');
  document.removeEventListener('mousemove', moveTooltip);
}

// BACKLOG
// ═══════════════════════════════════════════════════
function adicionarBacklog(mes) {
  const titulo = document.getElementById(`bk-titulo-${mes}`).value.trim();
  const fmt    = document.getElementById(`bk-fmt-${mes}`).value;
  const status = document.getElementById(`bk-status-${mes}`).value;
  const link   = document.getElementById(`bk-link-${mes}`).value.trim();
  if(!titulo){ alert('Coloca pelo menos o título da ideia.'); return; }
  estado[mes].backlog.push({ id: Date.now(), titulo, fmt, status, link });
  salvarMes(mes);
  renderBacklog(mes);
  document.getElementById(`bk-titulo-${mes}`).value = '';
  document.getElementById(`bk-fmt-${mes}`).value = '';
  document.getElementById(`bk-status-${mes}`).value = 'Ideia';
  document.getElementById(`bk-link-${mes}`).value = '';
  flash(`status-bk-${mes}`);
}

function deletarBacklog(mes, id) {
  estado[mes].backlog = estado[mes].backlog.filter(b => b.id !== id);
  salvarMes(mes);
  renderBacklog(mes);
}

function atualizarStatusBacklog(mes, id, novoStatus) {
  const item = estado[mes].backlog.find(b => b.id === id);
  if(item) item.status = novoStatus;
  salvarMes(mes);
  renderBacklog(mes);
}

function statusTagClass(s) {
  if(s==='Ideia')        return 'st-ideia';
  if(s==='Em produção')  return 'st-producao';
  if(s==='Aprovado')     return 'st-aprovado';
  if(s==='Descartado')   return 'st-descartado';
  return 'st-ideia';
}

function renderBacklog(mes) {
  const bl = estado[mes].backlog;
  const el = document.getElementById(`bk-list-${mes}`);
  const cnt = document.getElementById(`bk-count-${mes}`);
  if(!el) return;
  if(cnt) cnt.textContent = bl.length > 0 ? `(${bl.length})` : '';
  if(bl.length === 0) {
    el.innerHTML = `<div class="bk-empty">Nenhuma ideia no backlog ainda.<br>Use o formulário acima para começar.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="bk-header">
      <span>Ideia</span><span>Formato</span><span>Status</span><span>Link</span><span></span>
    </div>` +
    bl.map(b => `
    <div class="bk-item">
      <span class="bk-titulo">${b.titulo}</span>
      <span style="font-size:13px;color:var(--muted);">${b.fmt ? (FORMATOS_CFG[b.fmt]?.icon||'📌')+' '+b.fmt : '—'}</span>
      <select onchange="atualizarStatusBacklog('${mes}',${b.id},this.value)"
        style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg);cursor:pointer;">
        ${['Ideia','Em produção','Aprovado','Descartado'].map(s =>
          `<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      ${b.link ? `<a class="bk-link" href="${b.link}" target="_blank" rel="noopener">🔗 ${b.link.replace(/^https?:\/\//,'').slice(0,30)}${b.link.length>40?'…':''}</a>` : '<span style="color:var(--muted);font-size:12px;">—</span>'}
      <button class="btn-del" onclick="deletarBacklog('${mes}',${b.id})">×</button>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════
// TEMAS
// ═══════════════════════════════════════════════════
let _formatosTema = {}; // { mes: [ {formato, data} ] }

function initFormatosTema(mes) {
  if (!_formatosTema[mes]) _formatosTema[mes] = [{ formato: '', data: '' }];
  renderFormatosTema(mes);
}

function adicionarFormatoTema(mes) {
  if (!_formatosTema[mes]) _formatosTema[mes] = [];
  _formatosTema[mes].push({ formato: '', data: '' });
  renderFormatosTema(mes);
}

function removerFormatoTema(mes, i) {
  _formatosTema[mes].splice(i, 1);
  renderFormatosTema(mes);
}

function renderFormatosTema(mes) {
  const el = document.getElementById(`tm-formatos-${mes}`);
  if(!el) return;
  el.innerHTML = (_formatosTema[mes]||[]).map((f,i) => `
    <div style="display:grid;grid-template-columns:180px 140px auto;gap:8px;align-items:center;">
      <select id="tmf-fmt-${mes}-${i}" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);">
        <option value="">Formato...</option>
        ${Object.keys(FORMATOS_CFG).map(f=>`<option value="${f}" ${f===f.formato?'selected':''}>${FORMATOS_CFG[f].icon} ${f}</option>`).join('')}
      </select>
      <input type="date" id="tmf-data-${mes}-${i}" value="${f.data||''}"
        style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);" />
      <button onclick="removerFormatoTema('${mes}',${i})"
        style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;">×</button>
    </div>`).join('');
}

function salvarTema(mes) {
  const titulo = document.getElementById(`tm-titulo-${mes}`)?.value.trim();
  const pilar  = document.getElementById(`tm-pilar-${mes}`)?.value;
  if(!titulo) { alert('Coloca o nome do tema.'); return; }

  const formatos = (_formatosTema[mes]||[]).map((_, i) => ({
    formato: document.getElementById(`tmf-fmt-${mes}-${i}`)?.value || '',
    data:    document.getElementById(`tmf-data-${mes}-${i}`)?.value || '',
    status:  'Agendado'
  })).filter(f => f.formato);

  if(formatos.length === 0) { alert('Adiciona pelo menos um formato.'); return; }

  const tema = { id: Date.now(), titulo, pilar, formatos };
  if(!estado[mes].temas) estado[mes].temas = [];
  estado[mes].temas.push(tema);
  salvarMes(mes);

  // Limpa form
  document.getElementById(`tm-titulo-${mes}`).value = '';
  document.getElementById(`tm-pilar-${mes}`).value = '';
  _formatosTema[mes] = [{ formato: '', data: '' }];
  renderFormatosTema(mes);
  renderTemas(mes);
  flash(`status-tm-${mes}`);
}

function deletarTema(mes, id) {
  estado[mes].temas = (estado[mes].temas||[]).filter(t => t.id !== id);
  salvarMes(mes);
  renderTemas(mes);
}

function atualizarStatusTema(mes, temaId, fmtIdx, novoStatus) {
  const tema = (estado[mes].temas||[]).find(t => t.id === temaId);
  if(tema && tema.formatos[fmtIdx]) {
    tema.formatos[fmtIdx].status = novoStatus;
    // Se publicado, registra também nas publicações
    if(novoStatus === 'Publicado') {
      const fmt = tema.formatos[fmtIdx];
      // Verifica se já não existe
      const jaExiste = estado[mes].pubs.some(p => p.temaId === temaId && p.fmtIdx === fmtIdx);
      if(!jaExiste) {
        estado[mes].pubs.push({
          id: Date.now(), temaId, fmtIdx,
          titulo: `${tema.titulo} — ${fmt.formato}`,
          data: fmt.data, formato: fmt.formato, pilar: tema.pilar
        });
      }
    }
    salvarMes(mes);
    renderTemas(mes);
    renderMesDashboard(mes);
    trocarSubAba(mes, 'temas', null);
  }
}

function statusTemaClass(status, data) {
  if(status === 'Publicado')  return { cls:'tag-publicado',  label:'✅ Publicado',  cor:'#1A7A4A', bg:'#E8F5EE' };
  if(status === 'Cancelado')  return { cls:'tag-cancelado',  label:'⚫ Cancelado',  cor:'#888780', bg:'#F0F0EE' };
  if(data) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const d = new Date(data+'T12:00:00');
    if(d < hoje) return { cls:'tag-atrasado', label:'🔴 Atrasado', cor:'#c0392b', bg:'#FDECEA' };
    if(d.toDateString()===hoje.toDateString()) return { cls:'tag-hoje', label:'🟡 Hoje', cor:'#B45309', bg:'#FEF3C7' };
  }
  return { cls:'tag-agendado', label:'🔵 Agendado', cor:'#1E4D8C', bg:'#EBF3FF' };
}

function renderTemas(mes) {
  const temas = estado[mes].temas || [];
  const el  = document.getElementById(`tm-list-${mes}`);
  const cnt = document.getElementById(`tm-count-${mes}`);
  if(!el) return;
  if(cnt) cnt.textContent = temas.length > 0 ? `(${temas.length})` : '';
  if(temas.length === 0) {
    el.innerHTML = `<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;text-align:center;font-size:14px;color:var(--muted);">Nenhum tema criado ainda.<br>Use o formulário acima para começar.</div>`;
    return;
  }
  el.innerHTML = temas.map(t => `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);">
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text);">${t.titulo}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${t.pilar||'Sem pilar'} · ${t.formatos.length} formato${t.formatos.length>1?'s':''}</div>
        </div>
        <button onclick="deletarTema('${mes}',${t.id})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;">×</button>
      </div>
      <div style="padding:12px 18px;display:flex;flex-direction:column;gap:8px;">
        ${t.formatos.map((f,i) => {
          const st = statusTemaClass(f.status, f.data);
          const fmtData = f.data ? (() => { const [y,m,d]=f.data.split('-'); return `${d}/${m}`; })() : '—';
          return `<div style="display:grid;grid-template-columns:1fr 80px auto 36px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;font-weight:500;">${FORMATOS_CFG[f.formato]?.icon||'📌'} ${f.formato}</span>
            <span style="font-size:12px;color:var(--muted);">${fmtData}</span>
            <select onchange="atualizarStatusTema('${mes}',${t.id},${i},this.value)"
              style="padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid ${st.cor};background:${st.bg};color:${st.cor};">
              ${['Agendado','Publicado','Cancelado'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
            <span style="font-size:11px;font-weight:600;color:${st.cor};"></span>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('visible');
  setTimeout(()=>el.classList.remove('visible'), 2000);
}

  document.getElementById('header-badge').textContent =
    total===0 ? '0 publicações no ano' : `${total} publicações em 2026`;
}
